name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 馃攷 Change Detection
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: 馃摜 Checkout
        uses: actions/checkout@v5
      - name: 馃Л Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'apps/dsa-web/**'

  ai-governance:
    name: ai-governance
    runs-on: ubuntu-latest
    steps:
      - name: 馃摜 Checkout
        uses: actions/checkout@v5
      - name: 馃悕 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 馃 Check AI governance assets
        run: python scripts/check_ai_assets.py

  backend-gate:
    name: backend-gate
    runs-on: ubuntu-latest
    needs: [ai-governance]
    steps:
      - name: 馃摜 Checkout
        uses: actions/checkout@v5
      - name: 馃悕 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - name: 馃摝 Install dependencies
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if python -m pip install -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
      - name: 鉁?Python syntax check
        run: ./scripts/ci_gate.sh syntax
      - name: 鉁?Flake8 critical checks
        run: ./scripts/ci_gate.sh flake8
      - name: 鉁?Local deterministic checks
        run: ./scripts/ci_gate.sh deterministic
      - name: 鉁?Offline test suite
        run: ./scripts/ci_gate.sh offline-tests

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [backend-gate]
    steps:
      - name: 馃摜 Checkout
        uses: actions/checkout@v5
      - name: 馃惓 Build image
        run: |
          docker build -t stock-analysis:test -f docker/Dockerfile .
          docker run --rm stock-analysis:test python -c "print('鉁?Docker OK')"
      - name: 馃攳 Docker smoke imports
        run: |
          docker run --rm stock-analysis:test python -c "
          from src.config import get_config; print('鉁?config')
          from src.storage import DatabaseManager; print('鉁?storage')
          from src.notification import NotificationService; print('鉁?notification')
          from data_provider import DataFetcherManager; print('鉁?data_provider')
          from src.analyzer import GeminiAnalyzer; print('鉁?analyzer')
          from src.patches.eastmoney_patch import eastmoney_patch; print('鉁?patch')
          from bot.dispatcher import CommandDispatcher; print('鉁?bot')
          from api.app import app; print('鉁?api')
          print('鉁?All Docker imports OK')
          "

  web-gate:
    name: web-gate
    runs-on: ubuntu-latest
    needs: [changes, ai-governance]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - name: 馃摜 Checkout
        uses: actions/checkout@v5
      - name: 馃煝 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: 馃摝 Install
        run: npm ci
      - name: 馃攷 Lint
        run: npm run lint
      - name: 馃彈锔?Build
        run: npm run build
