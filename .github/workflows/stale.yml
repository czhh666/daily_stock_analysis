# 鑷姩鍏抽棴杩囨湡鐨?Issues 鍜?PR
# 姣忓ぉ妫€鏌ヤ竴娆★紝鏍囪闀挎椂闂存棤鍝嶅簲鐨?issues/PRs

name: Stale Issues & PRs

on:
