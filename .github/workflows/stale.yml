  # 鏀寔鎵嬪姩瑙﹀彂
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: 馃Ч 娓呯悊杩囨湡 Issues/PRs
    runs-on: ubuntu-latest
    
    steps:
      - name: 馃彿锔?鏍囪骞跺叧闂繃鏈熷唴瀹?        uses: actions/stale@v10
        with:
          # ===== Issue 閰嶇疆 =====
          days-before-issue-stale: 7
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: |
            馃憢 杩欎釜 Issue 宸茬粡 **7 澶?* 娌℃湁娲诲姩浜嗐€?            
            濡傛灉闂浠嶇劧瀛樺湪锛岃鍥炲璇存槑鏈€鏂版儏鍐碉紝鎴戜滑浼氱户缁窡杩涖€?            濡傛灉闂宸茶В鍐虫垨涓嶅啀闇€瑕侊紝鍙互鐩存帴鍏抽棴姝?Issue銆?            
            **濡傛灉 7 澶╁唴娌℃湁鍥炲锛屾 Issue 灏嗚嚜鍔ㄥ叧闂€?*
          close-issue-message: |
            馃敀 鐢变簬闀挎椂闂存病鏈夋椿鍔紝姝?Issue 宸茶嚜鍔ㄥ叧闂€?            
            濡傛灉闂浠嶇劧瀛樺湪锛屾杩庨噸鏂版墦寮€鎴栧垱寤烘柊鐨?Issue銆?          
          # ===== PR 閰嶇疆 =====
          days-before-pr-stale: 21
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: |
            馃憢 杩欎釜 PR 宸茬粡 **21 澶?* 娌℃湁娲诲姩浜嗐€?            
            璇锋鏌ユ槸鍚﹂渶瑕侊細
            - 瑙ｅ喅鍚堝苟鍐茬獊
            - 鍥炲 review 鎰忚
            - 鏇存柊浠ｇ爜
            
            **濡傛灉 14 澶╁唴娌℃湁鏇存柊锛屾 PR 灏嗚嚜鍔ㄥ叧闂€?*
          close-pr-message: |
            馃敀 鐢变簬闀挎椂闂存病鏈夋椿鍔紝姝?PR 宸茶嚜鍔ㄥ叧闂€?            
            濡傛灉鎮ㄤ粛甯屾湜鍚堝叆杩欎簺鏇存敼锛岃閲嶆柊鎵撳紑鎴栧垱寤烘柊鐨?PR銆?          
          # ===== 鎺掗櫎瑙勫垯 =====
          # 甯︽湁杩欎簺鏍囩鐨勪笉浼氳鏍囪涓?stale
          exempt-issue-labels: 'pinned,security,enhancement,help wanted,good first issue'
          exempt-pr-labels: 'pinned,security,work-in-progress,wip'
          
          # 鎺掗櫎鑽夌 PR
          exempt-draft-pr: true
          
          # ===== 鍏朵粬閰嶇疆 =====
          # 姣忔杩愯鏈€澶氬鐞嗙殑鏁伴噺
          operations-per-run: 50
          
          # 鍙鐞嗚繖浜涚姸鎬佺殑
          only-labels: ''
          
          # 绉婚櫎 stale 鏍囩锛堝綋鏈夋柊娲诲姩鏃讹級
          remove-stale-when-updated: true
          
          # 璋冭瘯妯″紡锛堣涓?true 鏃跺彧鎵撳嵃涓嶅疄闄呮搷浣滐級
          debug-only: false
